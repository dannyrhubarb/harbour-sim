<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Harbour Sim</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#091a26">
  <!-- iOS home screen support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Harbour Sim">
  <link rel="apple-touch-icon" href="./icon-180.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #091a26; }
    canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }

    :root {
      --text: #cde3f0;
      --dim: #82a0b2;
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Courier New", monospace;
    }

    /* Loading overlay: visible until the wasm is up. pointer-events none so
       it can never eat input if hiding fails. */
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: #091a26;
      color: var(--text);
      font-family: var(--mono);
      z-index: 20;
      pointer-events: none;
      transition: opacity 0.4s;
    }
    #loading.off { opacity: 0; }
    #loading h1 { font-size: 28px; letter-spacing: 0.3em; font-weight: 600; }
    #loading .sub { color: var(--dim); font-size: 13px; }

    /* Boot-guard error banner (script/wasm failures painted on screen). */
    #errbox {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: 12px;
      display: none;
      background: rgba(60, 12, 12, 0.92);
      color: #ffd7d0;
      font: 12px/1.5 var(--mono);
      padding: 10px 12px;
      border: 1px solid #a33;
      border-radius: 6px;
      white-space: pre-wrap;
      word-break: break-word;
      z-index: 30;
    }
  </style>

  <!-- Boot guard: a standalone script tag AHEAD of the bundle (script tags
       parse independently, so no error in the bundle or main script can kill
       it). Paints any script error on screen with file:line, and offers a
       reload hint if the wasm never comes up. Same pattern as Pegasus. -->
  <script>
    (function () {
      function show(msg) {
        var box = document.getElementById("errbox");
        if (!box) { document.addEventListener("DOMContentLoaded", function () { show(msg); }); return; }
        box.style.display = "block";
        box.textContent += (box.textContent ? "\n" : "") + msg;
      }
      window.addEventListener("error", function (e) {
        if (!e.filename && !e.message) return; // anonymous 3rd-party noise
        show("Error: " + (e.message || "(no message)") +
             (e.filename ? "\n  at " + e.filename + ":" + e.lineno : ""));
      });
      window.addEventListener("unhandledrejection", function (e) {
        if (e.reason == null) return;
        show("Unhandled rejection: " + e.reason);
      });
      setTimeout(function () {
        if (typeof wasm_exports === "undefined" || !wasm_exports) {
          show("Game failed to start after 8 s — check the connection and reload.");
        }
      }, 8000);
    })();
  </script>
</head>
<body>
  <canvas id="glcanvas" tabindex="1"></canvas>
  <div id="loading">
    <h1>HARBOUR SIM</h1>
    <div class="sub">casting off&hellip;</div>
    <div class="sub" id="rev-line"></div>
  </div>

  <script src="./mq_js_bundle.js"></script>
  <script>
    // Deploy-time injected revision (build-site sed). Local dev keeps the
    // placeholder — then no cache-buster is appended.
    const wasmRev = "f064515-pr-9";
    if (!wasmRev.startsWith("__")) {
      document.getElementById("rev-line").textContent = "build " + wasmRev;
    }
    load("./harbour-sim.wasm" + (wasmRev.startsWith("__") ? "" : "?v=" + wasmRev));

    // Fade the loading overlay once the wasm is running, then start pushing
    // safe-area insets (notch etc.) into the game.
    const loadPoll = setInterval(() => {
      if (typeof wasm_exports !== "undefined" && wasm_exports) {
        document.getElementById("loading").classList.add("off");
        clearInterval(loadPoll);
        pushSafeArea();
      }
    }, 100);

    // Safe-area insets → wasm (css px, used as-is by the game's HUD layout).
    // A hidden probe element resolves env(safe-area-inset-*) (needs the
    // viewport-fit=cover meta, present above); the bottom inset also folds
    // in the floating browser toolbar via visualViewport, so controls stay
    // above the URL bar. Everything feature-detected + try/caught — this
    // must never break the game.
    const saProbe = document.createElement("div");
    saProbe.style.cssText =
      "position:fixed;visibility:hidden;pointer-events:none;" +
      "top:env(safe-area-inset-top);left:env(safe-area-inset-left);" +
      "right:env(safe-area-inset-right);bottom:env(safe-area-inset-bottom);";
    document.body.appendChild(saProbe);
    function pushSafeArea() {
      try {
        if (typeof wasm_exports === "undefined" || !wasm_exports || !wasm_exports.set_safe_area) return;
        const cs = getComputedStyle(saProbe);
        const px = (v) => Math.max(0, parseFloat(v) || 0);
        let bottom = px(cs.bottom);
        const vv = window.visualViewport;
        if (vv) {
          // The canvas is 100vh and extends under a floating toolbar.
          bottom = Math.max(bottom, window.innerHeight - vv.height - vv.offsetTop);
        }
        wasm_exports.set_safe_area(px(cs.top), px(cs.left), bottom, px(cs.right));
      } catch (e) { /* never fatal */ }
    }
    window.addEventListener("resize", pushSafeArea);
    window.addEventListener("orientationchange", () => setTimeout(pushSafeArea, 300));
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", pushSafeArea);
      window.visualViewport.addEventListener("scroll", pushSafeArea);
    }

    // Stuck-drag fix — see CLAUDE.md. The vendored bundle wires mouseup to
    // the canvas only, so a release that happens after the pointer has left
    // the browser window never reaches miniquad: its button-down state
    // sticks forever and a drag claim (e.g. a HUD dial) stays "grabbed" on
    // return. Primary fix: Pointer Capture — once set on pointerdown, the
    // browser is spec-required to keep delivering pointerup/pointermove to
    // `canvas` even while the pointer is outside the window (verified in
    // headless Chromium: pointerup fires with real, negative, off-viewport
    // coordinates once captured). Filtered to pointerType "mouse" so touch
    // gestures — handled entirely separately, see Frontend conventions —
    // are untouched. `canvas`/`dpi_scale` are globals from mq_js_bundle.js.
    function releaseAllMouseButtonsAt(clientX, clientY) {
      if (typeof wasm_exports === "undefined" || !wasm_exports || !wasm_exports.mouse_up) return;
      const rect = canvas.getBoundingClientRect();
      const scale = dpi_scale();
      const x = (clientX - rect.left) * scale;
      const y = (clientY - rect.top) * scale;
      for (const button of [0, 1, 2]) wasm_exports.mouse_up(x, y, button);
    }
    canvas.addEventListener("pointerdown", (e) => {
      if (e.pointerType === "mouse") canvas.setPointerCapture(e.pointerId);
    });
    canvas.addEventListener("pointerup", (e) => {
      if (e.pointerType === "mouse") releaseAllMouseButtonsAt(e.clientX, e.clientY);
    });
    canvas.addEventListener("pointercancel", (e) => {
      if (e.pointerType === "mouse") releaseAllMouseButtonsAt(e.clientX, e.clientY);
    });
    // Fallback for browsers without Pointer Capture support: `mouseout` on
    // `document` with a null `relatedTarget` is the standard cross-browser
    // signal for "the pointer left the window" (NOT `mouseleave`, which
    // doesn't reliably fire for a real window-exit). Plus window blur, for
    // focus lost without a viewport-boundary crossing (e.g. alt-tab).
    let lastClientX = 0, lastClientY = 0;
    window.addEventListener("mousemove", (e) => {
      lastClientX = e.clientX;
      lastClientY = e.clientY;
    });
    const releaseAllMouseButtons = () => releaseAllMouseButtonsAt(lastClientX, lastClientY);
    document.addEventListener("mouseout", (e) => {
      if (e.relatedTarget === null) releaseAllMouseButtons();
    });
    window.addEventListener("blur", releaseAllMouseButtons);
  </script>
</body>
</html>
